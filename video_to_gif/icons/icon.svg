<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  
  <!-- Outer Glow -->
  <circle cx="256" cy="256" r="200" fill="#6366f1" opacity="0.15"/>

  <!-- Frame Box -->
  <rect x="120" y="120" width="272" height="272" rx="40" fill="none" stroke="url(#accent)" stroke-width="18"/>

  <!-- Play Symbol -->
  <path d="M 230 200 L 310 256 L 230 312 Z" fill="#6366f1"/>

  <!-- GIF Badge -->
  <text x="365" y="145" font-family="system-ui, sans-serif" font-weight="900" font-size="52" fill="#10b981" text-anchor="end">GIF</text>
</svg>
