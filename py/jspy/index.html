<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Python-like REPL Environment</title>
    <style>
        body { font-family: monospace; background: #1e1e1e; color: #d4d4d4; padding: 20px; }
        #container { display: flex; gap: 20px; flex-wrap: wrap; }
        .pane { flex: 1; min-width: 350px; }
        #console { background: #252526; padding: 15px; border-radius: 5px; height: 300px; overflow-y: auto; border: 1px solid #3c3c3c; }
        #plotCanvas { background: #111; border-radius: 5px; border: 1px solid #3c3c3c; display: block; margin-top: 10px; }
        input { width: 100%; padding: 10px; background: #333; border: 1px solid #444; color: #fff; font-family: monospace; margin-top: 10px; box-sizing: border-box; }
        .output-line { margin: 4px 0; }
        .error { color: #f44545; }
        .success { color: #4ec9b0; }
    </style>
</head>
<body>

    <h3>Python-like REPL Environment</h3>

    <div id="container">
        <div class="pane">
            <div id="console"></div>
            <input type="text" id="userInput" placeholder="Enter expression (e.g., plot(t, map((lambda x: sqrt(1 - x**2)), t)))" autofocus>
        </div>
        <div class="pane">
            <canvas id="plotCanvas" width="800" height="800"></canvas>
        </div>
    </div>

    <script>
        class PrimitiveStore {
            constructor() {
                this.registry = new Array(26).fill(null).map(() => ({ type: 'None', value: null }));
            }

            setVar(name, val) {
                const index = name.charCodeAt(0) - 97;
                if (index < 0 || index > 25) throw new Error(`Variable out of range ('${name}' must be a-z)`);

                let type = 'unknown';
                if (Array.isArray(val)) {
                    type = 'list';
                } else if (typeof val === 'number') {
                    type = Number.isInteger(val) ? 'int' : 'float';
                } else if (typeof val === 'string') {
                    type = val.length === 1 ? 'char' : 'string';
                }

                this.registry[index] = { type, value: val };
            }

            getVar(name) {
                const index = name.charCodeAt(0) - 97;
                return this.registry[index]?.value;
            }

            exportToScope() {
                let scopeString = "";
                // Math helpers
                scopeString += "const sin = Math.sin, cos = Math.cos, tan = Math.tan; ";
                scopeString += "const asin = Math.asin, acos = Math.acos, atan = Math.atan; ";
                scopeString += "const sqrt = Math.sqrt, log = Math.log, exp = Math.exp, abs = Math.abs; ";
                scopeString += "const pi = Math.PI, e = Math.E; ";

                // Python built-in helpers
                scopeString += "const map = (fn, arr) => (Array.isArray(arr) ? arr : Array.from(arr)).map(fn); ";
                scopeString += "const filter = (fn, arr) => (Array.isArray(arr) ? arr : Array.from(arr)).filter(fn); ";
                scopeString += "const sum = (arr) => (Array.isArray(arr) ? arr : Array.from(arr)).reduce((a, b) => a + b, 0); ";
                scopeString += "const prod = (arr) => (Array.isArray(arr) ? arr : Array.from(arr)).reduce((a, b) => a * b, 1); ";
                scopeString += "const len = (obj) => { " +
                    "if (obj === null || obj === undefined) return 0; " +
                    "if (Array.isArray(obj) || typeof obj === 'string') return obj.length; " +
                    "if (typeof obj === 'object') return Object.keys(obj).length; " +
                    "return 0; " +
                "}; ";
                scopeString += "const range = (start, stop, step) => { " +
                    "if (stop === undefined) { stop = start; start = 0; step = 1; } " +
                    "else if (step === undefined) { step = 1; } " +
                    "let res = []; for (let i = start; step > 0 ? i < stop : i > stop; i += step) res.push(i); return res; " +
                "}; ";
                scopeString += "const _slice = (arr, start, end, step) => { " +
                    "if (!Array.isArray(arr) && typeof arr !== 'string') return arr; " +
                    "if (step === undefined || step === null) step = 1; " +
                    "let len = arr.length; " +
                    "let s, e; " +
                    "if (step > 0) { " +
                        "s = (start === undefined || start === null) ? 0 : (start < 0 ? Math.max(0, len + start) : Math.min(len, start)); " +
                        "e = (end === undefined || end === null) ? len : (end < 0 ? Math.max(0, len + end) : Math.min(len, end)); " +
                    "} else { " +
                        "s = (start === undefined || start === null) ? len - 1 : (start < 0 ? Math.max(-1, len + start) : Math.min(len - 1, start)); " +
                        "e = (end === undefined || end === null) ? -1 : (end < 0 ? Math.max(-1, len + end) : Math.min(len, end)); " +
                    "} " +
                    "let res = []; " +
                    "if (step > 0) { " +
                        "for (let i = s; i < e; i += step) res.push(arr[i]); " +
                    "} else { " +
                        "for (let i = s; i > e; i += step) res.push(arr[i]); " +
                    "} " +
                    "return typeof arr === 'string' ? res.join('') : res; " +
                "}; ";
                scopeString += "const plot = _plotCanvasFunction; ";

                for (let i = 0; i < 26; i++) {
                    const char = String.fromCharCode(97 + i);
                    const val = this.registry[i].value;
                    if (val !== null) {
                        scopeString += `let ${char} = ${JSON.stringify(val)}; `;
                    }
                }
                return scopeString;
            }
        }

        const store = new PrimitiveStore();
        const consoleDiv = document.getElementById('console');
        const inputField = document.getElementById('userInput');

        const commandHistory = [];
        let historyIndex = -1;
        let tempInputBuffer = "";

        function logToConsole(text, className = '') {
            const div = document.createElement('div');
            div.className = `output-line ${className}`;
            div.textContent = text;
            consoleDiv.appendChild(div);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }

        // Canvas Plotter Implementation with NaN handling & Grid Lines
        function _plotCanvasFunction(xData, yData) {
            if (!Array.isArray(xData) || !Array.isArray(yData)) {
                throw new Error("plot() requires two array arguments: plot(x, y)");
            }
            if (xData.length !== yData.length) {
                throw new Error("x and y arrays must have matching dimensions");
            }

            const canvas = document.getElementById('plotCanvas');
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;

            ctx.clearRect(0, 0, width, height);

            const padding = 40;
            const plotWidth = width - 2 * padding;
            const plotHeight = height - 2 * padding;

            const validYData = yData.filter(v => !Number.isNaN(v) && v !== null && v !== undefined);
            const minX = Math.min(...xData);
            const maxX = Math.max(...xData);
            const minY = validYData.length > 0 ? Math.min(...validYData) : 0;
            const maxY = validYData.length > 0 ? Math.max(...validYData) : 1;

            const rangeX = maxX - minX === 0 ? 1 : maxX - minX;
            const rangeY = maxY - minY === 0 ? 1 : maxY - minY;

            // Coordinate conversion mapping
            const getX = (val) => padding + ((val - minX) / rangeX) * plotWidth;
            const getY = (val) => height - padding - ((val - minY) / rangeY) * plotHeight;

            // Draw grid lines
            ctx.strokeStyle = '#282828';
            ctx.lineWidth = 1;

            const numGridLines = 5;

            // Vertical grid lines
            for (let i = 0; i <= numGridLines; i++) {
                const val = minX + (rangeX / numGridLines) * i;
                const px = getX(val);
                ctx.beginPath();
                ctx.moveTo(px, padding);
                ctx.lineTo(px, height - padding);
                ctx.stroke();
            }

            // Horizontal grid lines
            for (let i = 0; i <= numGridLines; i++) {
                const val = minY + (rangeY / numGridLines) * i;
                const py = getY(val);
                ctx.beginPath();
                ctx.moveTo(padding, py);
                ctx.lineTo(width - padding, py);
                ctx.stroke();
            }

            // Draw plot border box
            ctx.strokeStyle = '#444';
            ctx.strokeRect(padding, padding, plotWidth, plotHeight);

            // Draw line curve (safely handling NaN values like domain errors in sqrt)
            ctx.strokeStyle = '#4ec9b0';
            ctx.lineWidth = 2;
            ctx.beginPath();
            let drawing = false;
            for (let i = 0; i < xData.length; i++) {
                const yVal = yData[i];
                if (Number.isNaN(yVal) || yVal === null || yVal === undefined) {
                    drawing = false;
                    continue;
                }
                const px = getX(xData[i]);
                const py = getY(yVal);
                if (!drawing) {
                    ctx.moveTo(px, py);
                    drawing = true;
                } else {
                    ctx.lineTo(px, py);
                }
            }
            ctx.stroke();

            // Axis labels & Ticks
            ctx.fillStyle = '#888';
            ctx.font = '10px monospace';
            ctx.fillText(minX.toFixed(1), padding, height - padding + 15);
            ctx.fillText(maxX.toFixed(1), width - padding - 25, height - padding + 15);
            ctx.fillText(maxY.toFixed(2), 5, padding + 5);
            ctx.fillText(minY.toFixed(2), 5, height - padding);

            logToConsole(`out> Plot rendered successfully with grid (${xData.length} points)`, 'success');
            return null;
        }

        function initializeEnvironment() {
            const initialExpr = "1 + 2 - 3.9 + 5.1 * (22/7) + 4000 + 3**4";
            try {
                const scopeSetup = store.exportToScope();
                const result = Function(`${scopeSetup} return ${initialExpr.replace(/\*\*/g, '**')};`)();
                store.setVar('a', result);
                logToConsole(`>>> a = ${initialExpr}`, 'success');
                logToConsole(`[System] Initialized 'a' = ${result}`, 'success');
            } catch (err) {
                logToConsole(`[Error initializing]: ${err.message}`, 'error');
            }
        }

        function display(val) {
            if (val === undefined || val === null) return val;
            let outputStr = val;
            if (Array.isArray(val)) {
                outputStr = `[${val.map(v => typeof v === 'number' ? Number(v.toFixed(4)) : v).join(', ')}]`;
            }
            logToConsole(`out> ${outputStr}`, 'success');
            return val;
        }

        function transpilePythonSyntax(code) {
            let processed = code.replace(/\*\*/g, '**');
            processed = processed.replace(/lambda\s+([^:]+):/g, '($1) =>');

            // Handle list comprehensions and Python slice syntax with steps/colons
            let result = '';
            let i = 0;

            while (i < processed.length) {
                if (processed[i] === '[') {
                    let depth = 0;
                    let start = i;
                    let handled = false;

                    for (let j = i; j < processed.length; j++) {
                        if (processed[j] === '[') depth++;
                        else if (processed[j] === ']') {
                            depth--;
                            if (depth === 0) {
                                let innerContent = processed.substring(start + 1, j);

                                // Check for list comprehension
                                let compMatch = parseListComp(innerContent);
                                if (compMatch) {
                                    if (compMatch.condition) {
                                        result += `${compMatch.collection}.filter(${compMatch.variable} => ${compMatch.condition}).map(${compMatch.variable} => ${compMatch.expr})`;
                                    } else {
                                        result += `${compMatch.collection}.map(${compMatch.variable} => ${compMatch.expr})`;
                                    }
                                    i = j + 1;
                                    handled = true;
                                    break;
                                } else {
                                    // Check for python slice notation containing colons (e.g. [1:], [1:5:2], [::-1])
                                    let colonIdx = -1;
                                    let innerDepth = 0;
                                    for (let c = 0; c < innerContent.length; c++) {
                                        if (innerContent[c] === '(' || innerContent[c] === '[' || innerContent[c] === '{') innerDepth++;
                                        else if (innerContent[c] === ')' || innerContent[c] === ']' || innerContent[c] === '}') innerDepth--;
                                        else if (innerDepth === 0 && innerContent[c] === ':') {
                                            colonIdx = c;
                                            break;
                                        }
                                    }

                                    if (colonIdx !== -1) {
                                        // Find object expression preceding '['
                                        let k = result.length - 1;
                                        let pDepth = 0, bDepth = 0;
                                        while (k >= 0) {
                                            let ch = result[k];
                                            if (ch === ')') pDepth++;
                                            else if (ch === '(') { pDepth--; if (pDepth < 0) break; }
                                            else if (ch === ']') bDepth++;
                                            else if (ch === '[') { bDepth--; if (bDepth < 0) break; }
                                            else if (pDepth === 0 && bDepth === 0) {
                                                if (!/[a-zA-Z0-9_.$]/.test(ch)) break;
                                            }
                                            k--;
                                        }
                                        let objExpr = result.substring(k + 1).trim();
                                        result = result.substring(0, k + 1);

                                        // Parse slice parts (start, end, step)
                                        let parts = [];
                                        let currentPart = '';
                                        let d1 = 0, d2 = 0, d3 = 0;
                                        for (let c = 0; c < innerContent.length; c++) {
                                            let char = innerContent[c];
                                            if (char === '(') d1++;
                                            else if (char === ')') d1--;
                                            else if (char === '[') d2++;
                                            else if (char === ']') d2--;
                                            else if (char === '{') d3++;
                                            else if (char === '}') d3--;
                                            else if (char === ':' && d1 === 0 && d2 === 0 && d3 === 0) {
                                                parts.push(currentPart.trim());
                                                currentPart = '';
                                                continue;
                                            }
                                            currentPart += char;
                                        }
                                        parts.push(currentPart.trim());

                                        let sStart = parts[0] !== '' ? parts[0] : 'undefined';
                                        let sEnd = parts[1] !== '' ? parts[1] : 'undefined';
                                        let sStep = (parts.length > 2 && parts[2] !== '') ? parts[2] : 'undefined';

                                        result += `_slice(${objExpr}, ${sStart}, ${sEnd}, ${sStep})`;
                                        i = j + 1;
                                        handled = true;
                                        break;
                                    }
                                }
                                break;
                            }
                        }
                    }
                    if (!handled) {
                        result += processed[i];
                        i++;
                    }
                } else {
                    result += processed[i];
                    i++;
                }
            }
            return result;
        }

        function parseListComp(content) {
            let depth = 0;
            let forIdx = -1;

            for (let k = 0; k < content.length - 4; k++) {
                if (content[k] === '[') depth++;
                else if (content[k] === ']') depth--;
                else if (depth === 0) {
                    if (content.substring(k, k + 5) === ' for ') {
                        forIdx = k;
                        break;
                    }
                }
            }

            if (forIdx === -1) return null;

            let expr = content.substring(0, forIdx).trim();
            let remainder = content.substring(forIdx + 5);

            depth = 0;
            let inMatchIdx = -1;
            for (let k = 0; k < remainder.length - 3; k++) {
                if (remainder[k] === '[') depth++;
                else if (remainder[k] === ']') depth--;
                else if (depth === 0) {
                    if (remainder.substring(k, k + 4) === ' in ') {
                        inMatchIdx = k;
                        break;
                    }
                }
            }

            if (inMatchIdx === -1) return null;

            let variable = remainder.substring(0, inMatchIdx).trim();
            let collectionAndCond = remainder.substring(inMatchIdx + 4).trim();

            let collection = collectionAndCond;
            let condition = null;
            depth = 0;
            for (let k = 0; k < collectionAndCond.length - 4; k++) {
                if (collectionAndCond[k] === '[') depth++;
                else if (collectionAndCond[k] === ']') depth--;
                else if (depth === 0) {
                    if (collectionAndCond.substring(k, k + 4) === ' if ') {
                        collection = collectionAndCond.substring(0, k).trim();
                        condition = collectionAndCond.substring(k + 4).trim();
                        break;
                    }
                }
            }

            if (!/^[a-zA-Z_][a-zA-Z0-9_]*$/.test(variable)) return null;

            return { expr, variable, collection, condition };
        }

        function findAssignmentSplit(code) {
            let depthParen = 0;
            let depthBracket = 0;

            for (let i = 0; i < code.length; i++) {
                let char = code[i];
                if (char === '(') depthParen++;
                else if (char === ')') depthParen--;
                else if (char === '[') depthBracket++;
                else if (char === ']') depthBracket--;
                else if (depthParen === 0 && depthBracket === 0 && char === '=') {
                    let prev = code[i - 1];
                    let next = code[i + 1];
                    if (prev !== '=' && prev !== '!' && prev !== '<' && prev !== '>' && prev !== '+' && prev !== '-' && prev !== '*' && prev !== '/' && next !== '=') {
                        return i;
                    }
                }
            }
            return -1;
        }

        function evaluateExpression(inputCode) {
            try {
                let processedCode = inputCode.trim();
                const scopeSetup = store.exportToScope();

                if (processedCode.startsWith("display(")) {
                    let innerCode = processedCode.substring(8, processedCode.length - 1);
                    const transpiledInner = transpilePythonSyntax(innerCode);
                    const evaluated = Function(`${scopeSetup} return ${transpiledInner};`)();
                    display(evaluated);
                    return;
                }

                let assignIdx = findAssignmentSplit(processedCode);

                if (assignIdx !== -1) {
                    const varPart = processedCode.substring(0, assignIdx).trim();
                    const exprPart = processedCode.substring(assignIdx + 1).trim();

                    const transpiledExpr = transpilePythonSyntax(exprPart);

                    if (varPart.includes(",")) {
                        const varNames = varPart.split(",").map(v => v.trim());
                        const vals = Function(`${scopeSetup} return [${transpiledExpr}];`)();

                        if (!Array.isArray(vals) || vals.length !== varNames.length) {
                            throw new Error("ValueError: too many/few values to unpack");
                        }

                        logToConsole(`>>> ${processedCode}`);
                        varNames.forEach((vName, idx) => {
                            store.setVar(vName, vals[idx]);
                            logToConsole(`${vName} = ${vals[idx]} [Type: ${store.registry[vName.charCodeAt(0)-97].type}]`);
                        });
                    } else {
                        const val = Function(`${scopeSetup} return ${transpiledExpr};`)();
                        store.setVar(varPart, val);
                        logToConsole(`>>> ${processedCode}`);
                        let outValDisplay = Array.isArray(val) ? `[${val.map(v => typeof v === 'number' ? Number(v.toFixed(4)) : v).join(', ')}]` : val;
                        logToConsole(`${varPart} = ${outValDisplay} [Type: ${store.registry[varPart.charCodeAt(0)-97].type}]`);
                    }
                } else {
                    const transpiledCode = transpilePythonSyntax(processedCode);
                    const val = Function(`${scopeSetup} return ${transpiledCode};`)();
                    display(val);
                }
            } catch (err) {
                logToConsole(`Error: ${err.message}`, 'error');
            }
        }

        inputField.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                const code = inputField.value;
                if (code.trim() !== "") {
                    commandHistory.push(code);
                    historyIndex = commandHistory.length;
                }
                logToConsole(`in> ${code}`);
                evaluateExpression(code);
                inputField.value = '';
                tempInputBuffer = "";
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (commandHistory.length > 0 && historyIndex > 0) {
                    if (historyIndex === commandHistory.length) {
                        tempInputBuffer = inputField.value;
                    }
                    historyIndex--;
                    inputField.value = commandHistory[historyIndex];
                }
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (commandHistory.length > 0 && historyIndex < commandHistory.length) {
                    historyIndex++;
                    if (historyIndex === commandHistory.length) {
                        inputField.value = tempInputBuffer;
                    } else {
                        inputField.value = commandHistory[historyIndex];
                    }
                }
            }
        });

        initializeEnvironment();
    </script>
</body>
</html>
