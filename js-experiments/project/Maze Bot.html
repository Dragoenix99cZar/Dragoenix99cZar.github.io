<!DOCTYPE html>
<!-- saved from url=(0067)https://dragoenix99czar.github.io/js-experiments/project/index.html -->
<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">	
	<title>Maze Bot</title>
	<link rel="stylesheet" href="./Maze Bot_files/style.css">
</head>

<body>
	<div class="container clearfix">
		<div class="main-left">
			<h1>M A Z E&nbsp; &nbsp;B O T</h1>
			<canvas id="gameCanvas" width="576" height="576"></canvas>
		</div>
		<div class="main-right">
			<span id="details">D e t a i l s</span>
			<form>
				Obstacle:<br>
				<input type="radio" name="obstacle" checked=""> Yes
				<input type="radio" name="obstacle" id="noObstacle"> No
				<br>
				Algorithm:<br>
				<input type="radio" name="pathfinding" checked=""> A*
				<input type="radio" name="pathfinding" id="dijkstra"> Dijkstra's
			</form>
			<p id="pathLength" style="margin: 5px auto; width: 300px; color: rgb(26, 66, 58); font-size: 18px;"><br>Current Path Information: <br>Length: 32 steps<br>Cost: 4.4 sec<br></p>
			<p id="coordinates">Start: (10,15), Goal: (0,5)<br><br></p>
			<button class="btnActive" onclick="createWorld()" style="display: block;">New World</button>
			<button class="btnInactive" style="display: none;">New World</button>
		</div>
	</div>
	<script type="text/javascript" src="scriptAstar.js"></script>

</body></html>
