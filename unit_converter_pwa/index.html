<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quick Unit Converter</title>
<meta name="description" content="A fast, offline-capable unit converter — metric, imperial, and traditional units.">
<meta name="theme-color" content="#10151A">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-512.png">
<link rel="apple-touch-icon" href="icons/icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Unit Convert">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app" id="app">

  <header class="app-header">
    <div class="header-row">
      <h1><img src="icons/icon-512.png" style="height:30px;"> Quick Unit Converter</h1>
      <button id="install-btn" class="install-btn" hidden>Install</button>
    </div>
    <p class="subtitle">Metric, imperial, and Nepali units — works offline. By Aman Karn</p>
  </header>

  <nav class="category-tabs" id="category-tabs" aria-label="Unit category"></nav>

  <main class="panel">

    <div id="load-error" class="load-error" hidden></div>

    <div id="category-label" class="category-label"></div>

    <section class="input-row">
      <label class="field-label" for="value-input">Value</label>
      <div class="input-group">
        <input
          id="value-input"
          class="value-input"
          type="text"
          inputmode="decimal"
          autocomplete="off"
          spellcheck="false"
          value="1"
          aria-describedby="input-error"
        >
        <button id="clear-btn" class="ghost-btn" type="button">Clear</button>
      </div>
      <p id="input-error" class="input-error" role="alert" hidden>Enter a valid number.</p>
    </section>

    <section class="from-row">
      <label class="field-label" for="from-select">From</label>
      <div class="select-wrap">
        <select id="from-select" aria-label="Convert from unit"></select>
      </div>
    </section>

    <section class="rate-row">
      <div class="rate-field">
        <label class="field-label" for="rate-input">Rate</label>
        <input
          id="rate-input"
          class="value-input"
          type="text"
          inputmode="decimal"
          autocomplete="off"
          spellcheck="false"
          value="1"
          aria-describedby="rate-error"
        >
      </div>
      <div class="rate-field">
        <label class="field-label" for="to-select">To</label>
        <div class="select-wrap">
          <select id="to-select" aria-label="Convert to unit"></select>
        </div>
      </div>
      <p id="rate-error" class="input-error" role="alert" hidden>Enter a valid rate.</p>
      <div class="rate-result-row">
        <span class="rate-result-label">Result (In $)</span>
        <span class="rate-result-value-group">
          <span id="rate-result" class="rate-result-value">—</span>
          <button id="rate-copy-btn" class="copy-btn" type="button" aria-label="Copy result" title="Copy result">
            <svg viewBox="0 0 20 20" width="15" height="15" fill="none" aria-hidden="true">
              <rect x="6" y="6" width="11" height="11" rx="1.5" stroke="currentColor" stroke-width="1.4"/>
              <path d="M3.5 13.5V4a1.5 1.5 0 0 1 1.5-1.5h9.5" stroke="currentColor" stroke-width="1.4"/>
            </svg>
          </button>
        </span>
      </div>
    </section>

    <section class="results-section" aria-live="polite">
      <div class="ledger-head">
        <span class="ledger-head-unit">Unit</span>
        <span class="ledger-head-value">Value</span>
      </div>
      <ul class="ledger" id="results-list"></ul>
    </section>

  </main>

  <footer class="app-footer">
    <a id="developer-info" class="developer-info" href="#" target="_blank" rel="noopener noreferrer" hidden></a>
    <span id="offline-pill" class="offline-pill" hidden>Offline</span>
  </footer>

</div>

<template id="result-row-template">
  <li class="ledger-row">
    <button class="copy-btn" type="button" aria-label="Copy value" title="Copy value">
      <svg viewBox="0 0 20 20" width="15" height="15" fill="none" aria-hidden="true">
        <rect x="6" y="6" width="11" height="11" rx="1.5" stroke="currentColor" stroke-width="1.4"/>
        <path d="M3.5 13.5V4a1.5 1.5 0 0 1 1.5-1.5h9.5" stroke="currentColor" stroke-width="1.4"/>
      </svg>
    </button>
    <span class="ledger-unit"></span>
    <span class="ledger-value"></span>
  </li>
</template>

<script src="app.js"></script>
</body>
</html>
