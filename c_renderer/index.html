<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pure Clang Wasm Canvas</title>
    <style>
        /*body{

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #121212ff; /* Fallback color */
            font-family: sans-serif;
        }

        /* Style the canvas to act as a background */
        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;        /* Push it behind text and buttons */
            pointer-events: none; /* Ignore clicks so elements on top stay interactive */
            object-fit: cover;  /* Scale smoothly to fit the screen */
        }

        /* Example container for foreground text */
        .content {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>
    <!--<canvas id="canvas" width="1800" height="900"></canvas>-->
    <!--<canvas id="canvas"></canvas>-->
    <canvas id="canvas" width="512" height="512"></canvas>

    <!-- UI/Text elements sit nicely on top -->
    <div class="content">
        <h1>WebAssembly Background: Refresh to load new animated bg</h1>
    </div>
    <script type="text/javascript" src="main.js"></script>
</body>
</html>
