<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wasm Nepali Date Converter</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 40px; display: flex; justify-content: center; }
        .container { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .result { margin-top: 20px; padding: 10px; background: #e9ecef; border-radius: 4px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Date Converter</h2>
    
    <div class="form-group">
        <label for="bsDate">BS Date (YYYY-MM-DD):</label>
        <input type="text" id="bsDate" placeholder="e.g., 2083-06-10">
    </div>

    <div class="form-group">
        <label for="adDate">AD Date (YYYY-MM-DD):</label>
        <input type="text" id="adDate" placeholder="e.g., 2026-09-26">
    </div>

    <div class="result" id="output" hidden>Status: Loading Wasm...</div>
</div>

<script>
    let wInst = null;

    async function load() {
        try {
            const response = await fetch('nep_cal.wasm');
            const bytes = await response.arrayBuffer();
            const results = await WebAssembly.instantiate(bytes);
            wInst = results.instance;
            document.getElementById('output').innerText = "Wasm Loaded Successfully!";
        } catch (err) {
            document.getElementById('output').hidden = false;
            document.getElementById('output').innerText = "Failed to load Wasm: " + err.message;
            console.error(err);
        }
    }

    function formatPackedDate(packed) {
        const year = Math.floor(packed / 10000);
        const month = String(Math.floor((packed % 10000) / 100)).padStart(2, '0');
        const day = String(packed % 100).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    function toad() {
        if (!wInst) return;
        const val = document.getElementById('bsDate').value.trim();
        const parts = val.split('-');
        if (parts.length !== 3) return;

        const packedAD = wInst.exports.btoa(parseInt(parts[0]), parseInt(parts[1]), parseInt(parts[2]));
        document.getElementById('adDate').value = formatPackedDate(packedAD);
        document.getElementById('output').innerText = "Converted Successfully!";
    }

    function tobs() {
        if (!wInst) return;
        const val = document.getElementById('adDate').value.trim();
        const parts = val.split('-');
        if (parts.length !== 3) return;

        const packedBS = wInst.exports.atob(parseInt(parts[0]), parseInt(parts[1]), parseInt(parts[2]));
        document.getElementById('bsDate').value = formatPackedDate(packedBS);
        document.getElementById('output').innerText = "Converted Successfully!";
    }

    function checkUrlHash() {
        const hashValue = window.location.hash.replace('#', '').trim();
        if (hashValue && hashValue.includes('-')) {
            document.getElementById('bsDate').value = hashValue;
            toad();
        }
    }

    window.addEventListener('hashchange', checkUrlHash);

    document.getElementById('bsDate').addEventListener('keydown', (e) => { if (e.key === 'Enter') toad(); });
    document.getElementById('adDate').addEventListener('keydown', (e) => { if (e.key === 'Enter') tobs(); });

    load();
</script>

</body>
</html>
