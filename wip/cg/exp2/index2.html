<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pixel-Art Graphics Engine Workbench</title>
  <style>
    body { background: #0f0f13; color: #e2e2e9; font-family: ui-monospace, monospace; display: flex; flex-direction: column; align-items: center; height: 100vh; margin: 0; overflow: hidden; padding: 2vh 0; box-sizing: border-box; }
    .header-group { text-align: center; margin-bottom: 10px; }
    h1 { font-size: 1.5rem; margin: 0 0 5px 0; color: #fff; letter-spacing: 1px; }
    .toolbar { display: flex; gap: 20px; align-items: center; background: #1a1a24; padding: 10px 25px; border-radius: 8px; border: 1px solid #2d2d3d; margin-bottom: 15px; }
    select, input[type="range"] { background: #0b0b0f; color: #00ffaa; border: 1px solid #3c3c4f; font-family: inherit; font-size: 13px; border-radius: 4px; }
    select { padding: 6px 12px; cursor: pointer; }
    .slider-group { display: flex; align-items: center; gap: 8px; }
    .canvas-container {
      /* 200 * 6.75 = 1350px width | 120 * 6.75 = 810px height */
      width: 1350px;
      height: 810px;
      
      position: relative;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      border: 3px solid #252533;
      border-radius: 4px;
      
      background-color: #050508;
      background-image: 
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      
      /* 800px / 160 = exactly 5px grid squares */
      background-size: 5px 5px; 
    }
    
    canvas { 
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
      
      /* Keeps your 1:1 scaled pixels super blocky and crisp */
      image-rendering: pixelated;
    }
  </style>
</head>
<body>

  <div class="header-group">
    <h1>Raster Algorithm Lab</h1>
    <div class="toolbar">
      <div>
        <label for="algoSelect">DRAW TARGET: </label>
        <select id="algoSelect">
          <option value="draw_line_direct">Line: y = mx + b</option>
          <option value="draw_line_dda">Line: DDA</option>
          <option value="draw_line_bresenham">Line: Bresenham Integer</option>
          <option value="draw_circle_bresenham" selected>Circle: Bresenham Midpoint</option>
        </select>
      </div>
      
      <div class="slider-group">
        <label for="thickSelect">BLOCK THICKNESS: </label>
        <input type="range" id="thickSelect" min="1" max="5" value="1" step="1">
        <span id="thickVal">1px</span>
      </div>
    </div>
  </div>

  <div class="canvas-container">
    <canvas id="canvas" width="200" height="120"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const algoSelect = document.getElementById('algoSelect');
    const thickSelect = document.getElementById('thickSelect');
    const thickVal = document.getElementById('thickVal');
    
    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;

    let wasmEngine = null;
    let isDrawing = false;
    let startPoint = { x: 0, y: 0 };

    thickSelect.addEventListener('input', (e) => {
      thickVal.textContent = e.target.value + 'px';
    });

    async function initWasm() {
      const response = await fetch('engine2.wasm');
      const buffer = await response.arrayBuffer();
      const obj = await WebAssembly.instantiate(buffer, {});
      wasmEngine = obj.instance.exports;
      wasmEngine.clear_screen();
      renderBuffer();
    }

    function renderBuffer() {
      if (!wasmEngine) return;
      const bufferPointer = wasmEngine.get_buffer_ptr();
      const bufferLength = WIDTH * HEIGHT * 4;
      const wasmPixels = new Uint8ClampedArray(wasmEngine.memory.buffer, bufferPointer, bufferLength);
      const imageData = new ImageData(wasmPixels, WIDTH, HEIGHT);
      ctx.putImageData(imageData, 0, 0);
    }

    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = WIDTH / rect.width;
      const scaleY = HEIGHT / rect.height;
      return {
        x: Math.floor((e.clientX - rect.left) * scaleX),
        y: Math.floor((e.clientY - rect.top) * scaleY)
      };
    }

    canvas.addEventListener('mousedown', (e) => {
      if (!wasmEngine) return;
      startPoint = getCanvasCoords(e);
      isDrawing = true;
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!isDrawing || !wasmEngine) return;
      const currentPoint = getCanvasCoords(e);

      wasmEngine.clear_screen();
      
      const targetAlgo = algoSelect.value;
      const thickness = parseInt(thickSelect.value, 10);
      
      if (targetAlgo === "draw_circle_bresenham") {
        // Calculate radius using Euclidean distance formula from center click point
        const dx = currentPoint.x - startPoint.x;
        const dy = currentPoint.y - startPoint.y;
        const radius = Math.floor(Math.sqrt(dx * dx + dy * dy));

        // Call your new circle routine: xc, yc, radius, thickness, r, g, b, a
        wasmEngine.draw_circle_bresenham(
          startPoint.x, startPoint.y, 
          radius, 
          thickness,
          255, 100, 180, 255 // Hot Pink Circle
        );
      } else {
        // Handle line options normally
        wasmEngine[targetAlgo](
          startPoint.x, startPoint.y, 
          currentPoint.x, currentPoint.y, 
          thickness,
          0, 255, 170, 255 // Cyan Lines
        );
      }

      renderBuffer();
    });

    canvas.addEventListener('mouseup', () => isDrawing = false);

    initWasm();
  </script>
</body>
</html>
