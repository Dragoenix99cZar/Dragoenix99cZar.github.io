<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Viewer with Zoom & Pan & Exporter</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0 auto;
            padding: 20px;
            background-color: #f8fafc;
            color: #1e293b;
        }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #1d4ed8; }
        .zoom-info {
            font-size: 0.875rem;
            color: #64748b;
            margin-left: auto;
        }
        .viewer-container {
            width: 100%;
            height: 600px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: white;
            overflow: hidden; /* Hide overflow so pan stays inside bounds */
            position: relative;
            cursor: grab;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        .viewer-container:active {
            cursor: grabbing;
        }
        .canvas-wrapper {
            position: absolute;
            transform-origin: 0 0;
            will-change: transform;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        object {
            display: block;
            pointer-events: none; /* Let pan/zoom events bubble to container */
        }
    </style>
</head>
<body>

    <h1>SVG Viewer</h1>
    <img src="tree.svg" alt="tree">
</body>
</html>
