<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizontal Patriarchal Genealogy Chart - JSON Export/Import</title>
    <style>
        :root {
            --bg-color: #121214;
            --panel-bg: #18181b;
            --card-bg: #27272a;
            --card-hover: #323238;
            --border-color: #3f3f46;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            color: var(--text-main);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 20px;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .main-layout {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 90vw;
            flex: 1;
        }

        #chart-container {
            flex: 1;
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            overflow-x: auto;
            position: relative;
        }

        #inspector {
            width: 320px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            gap: 15px;
            height: fit-content;
        }

        #inspector h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            color: var(--text-main);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 12px;
            color: var(--text-muted);
        }

        .form-group input[type="text"] {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 8px 10px;
            color: var(--text-main);
            font-size: 14px;
        }

        .form-group input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            text-align: center;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background: var(--accent-hover);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background: var(--card-bg);
        }

        .export-group {
            display: flex;
            gap: 45px;
            margin: 15px 5px;
        }

        .export-group .btn {
            font-size: 20px;
            padding: 12px 20px;
        }

        .placeholder-text {
            color: var(--text-muted);
            font-style: italic;
            font-size: 14px;
            text-align: center;
            margin-top: 40px;
        }

        svg {
            display: block;
        }

        .node-rect {
            fill: var(--card-bg);
            stroke: var(--border-color);
            stroke-width: 1.5px;
            rx: 6px;
            transition: all 0.2s ease;
        }

        .node-group:hover .node-rect {
            fill: var(--card-hover);
            stroke: var(--accent-color);
            cursor: pointer;
            filter: drop-shadow(0 4px 8px rgba(99, 102, 241, 0.2));
        }

        .node-group.selected .node-rect {
            stroke: var(--accent-color);
            stroke-width: 2px;
            fill: var(--card-hover);
        }

        .gen-tag {
            font-family: sans-serif;
            font-size: 11px;
            fill: var(--text-muted);
            font-weight: bold;
            letter-spacing: 0.5px;
            text-anchor: end;
        }

        .name-text {
            font-size: 20px;
            font-weight: bold;
            fill: var(--text-main);
        }

        .date-text {
            font-family: sans-serif;
            font-size: 11px; /* Increased from 10px */
            fill: var(--text-muted);
            text-anchor: end; /* Right-align text anchor */
        }

        .connector-branch {
            fill: none;
            stroke: var(--border-color);
            stroke-width: 2px;
        }

        .node-group.marked .node-rect {
            stroke: #392727; /* Amber/Gold accent */
            stroke-width: 2.5px;
            fill: #1d1814ad; /* Tinted background */
        }

        .node-group.marked:hover .node-rect {
            stroke: #392727;
            filter: drop-shadow(0 0px 3px rgba(245, 158, 11, 0.3));
        }
    </style>
</head>

            getTree() {
                const map = {};
                const roots = [];
                this.data.forEach(p => map[p.id] = { ...p, sons: [] });
                for (const id in map) {
                    const item = map[id];
                    if (item.fatherId && map[item.fatherId]) {
                        map[item.fatherId].sons.push(item);
                    } else if (!item.fatherId) {
                        roots.push(item);
                    }
                }
                return roots;
            },

            getNode(id) {
                return this.data.find(d => d.id === id);
            },

            updateNode(id, updatedFields) {
                const target = this.getNode(id);
                if (target) Object.assign(target, updatedFields);
            },

            addChild(parentId) {
                const newId = Math.max(...this.data.map(d => d.id), 0) + 1;
                const newChild = {
                    id: newId,
                    name: "New Descendant",
                    name_en: "Unknown",
                    fatherId: parentId,
                    gen: "GEN V"
                };
                this.data.push(newChild);
                this.selectedId = newId;
                return newId;
            },

            removeNodeAndSubtree(id) {
                const target = this.getNode(id);
                if (!target || target.fatherId === null) return false;

                function getDescendantIds(parentId, dataset) {
                    let ids = [parentId];
                    const children = dataset.filter(d => d.fatherId === parentId);
                    children.forEach(child => {
                        ids = ids.concat(getDescendantIds(child.id, dataset));
                    });
                    return ids;
                }

                const idsToRemove = getDescendantIds(id, this.data);
                this.data = this.data.filter(d => !idsToRemove.includes(d.id));
                this.selectedId = null;
                return true;
            },

            getMaxDepth() {
                if (this.data.length === 0) return 0;
                return Math.max(...this.data.map(d => {
                    let depth = 0;
                    let curr = d;
                    while(curr.fatherId) {
                        depth++;
                        curr = this.getNode(curr.fatherId) || {};
                    }
                    return depth;
                }));
            }
        };


        /* ==========================================================================
           2. INDEPENDENT SVG RENDERING ENGINE
           ========================================================================== */
        const SVGChartRenderer = {
            cardW: 180,
            cardH: 80,
            columnGap: 240,
            ns: "http://www.w3.org/2000/svg",

            el(type, attrs) {
                const e = document.createElementNS(this.ns, type);
                for (const k in attrs) e.setAttribute(k, attrs[k]);
                return e;
            },

            computePositions(node, currentColumn = 0, state = { leafCounter: 0 }) {
                node.x = currentColumn * this.columnGap + 20;

                if (node.sons && node.sons.length > 0) {
                    node.sons.forEach(son => this.computePositions(son, currentColumn + 1, state));
                    const firstSonY = node.sons[0].y;
                    const lastSonY = node.sons[node.sons.length - 1].y;
                    node.y = (firstSonY + lastSonY) / 2;
                } else {
                    node.y = state.leafCounter * (this.cardH + 25) + 20;
                    state.leafCounter++;
                }
            },

            renderTree(node, svgCanvas, selectedNodeId, onNodeClick) {
                if (node.sons && node.sons.length > 0) {
                    node.sons.forEach(son => {
                        const startX = node.x + this.cardW;
                        const startY = node.y + this.cardH / 2;
                        const endX = son.x;
                        const endY = son.y + this.cardH / 2;
                        const splitX = startX + (endX - startX) * 0.5;

                        const pathString = `M ${startX} ${startY}
                                            L ${splitX} ${startY}
                                            L ${splitX} ${endY}
                                            L ${endX} ${endY}`;

                        svgCanvas.appendChild(this.el("path", { d: pathString, class: "connector-branch" }));
                        this.renderTree(son, svgCanvas, selectedNodeId, onNodeClick);
                    });
                }

                const g = this.el("g", {
                    class: `node-group ${node.id === selectedNodeId ? 'selected' : ''} ${node.marked ? 'marked' : ''}`,
                    "data-id": node.id
                });

                g.addEventListener("click", () => onNodeClick(node.id));

                g.appendChild(this.el("rect", {
                    x: node.x, y: node.y, width: this.cardW, height: this.cardH, class: "node-rect"
                }));

                // Right-aligned Generation Tag (X set to right edge minus padding)
                const gen = this.el("text", {
                    x: node.x + this.cardW - 10,
                    y: node.y + 15,
                    class: "gen-tag"
                });
                gen.textContent = node.gen;
                g.appendChild(gen);

                // Left-aligned Name Text
                const name = this.el("text", {
                    x: node.x + 12,
                    y: node.y + 45,
                    class: "name-text"
                });
                name.textContent = node.name;
                g.appendChild(name);

                // Right-aligned name_en Text (X set to right edge minus padding)
                const dates = this.el("text", {
                    x: node.x + this.cardW - 10,
                    y: node.y + 68,
                    class: "date-text"
                });
                dates.textContent = node.name_en;
                g.appendChild(dates);

                svgCanvas.appendChild(g);
            },

            buildSVG(roots, maxCol, state, selectedId, onNodeClick) {
                const canvasW = (maxCol + 1) * this.columnGap + 60;
                const canvasH = state.leafCounter * (this.cardH + 25) + 30;

                const svg = this.el("svg", {
                    width: Math.max(canvasW, 800),
                    height: Math.max(canvasH, 400),
                    viewBox: `0 0 ${Math.max(canvasW, 800)} ${Math.max(canvasH, 400)}`
                });

                if (roots.length > 0) {
                    this.renderTree(roots[0], svg, selectedId, onNodeClick);
                }
                return svg;
            }
        };


        /* ==========================================================================
           3. UI CONTROLLER & EVENT BINDINGS
           ========================================================================== */
        function refreshApp() {
            const container = document.getElementById("chart-container");
            container.innerHTML = "";

            const roots = GenealogyStore.getTree();
            const state = { leafCounter: 0 };

            if (roots.length > 0) {
                SVGChartRenderer.computePositions(roots[0], 0, state);
            }

            const maxCol = GenealogyStore.getMaxDepth();
            const svgElement = SVGChartRenderer.buildSVG(
                roots,
                maxCol,
                state,
                GenealogyStore.selectedId,
                (id) => {
                    GenealogyStore.selectedId = id;
                    refreshApp();
                }
            );

            container.appendChild(svgElement);
        }


        /* ==========================================================================
           4. EXPORT & IMPORT UTILITIES
           ========================================================================== */
        function downloadFile(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Export JSON Button Handler
        document.getElementById("export-json").addEventListener("click", () => {
            const jsonString = JSON.stringify(GenealogyStore.data, null, 4);
            const blob = new Blob([jsonString], { type: "application/json;charset=utf-8" });
            downloadFile(blob, "lineageData.json");
        });

        function getReadySVGString() {
            const svgElement = document.querySelector("#chart-container svg");
            if (!svgElement) return null;
            const clone = svgElement.cloneNode(true);

            const computedStyle = getComputedStyle(document.documentElement);
            const panelBg = computedStyle.getPropertyValue('--panel-bg').trim() || '#18181b';
            const cardBg = computedStyle.getPropertyValue('--card-bg').trim() || '#27272a';
            const borderColor = computedStyle.getPropertyValue('--border-color').trim() || '#3f3f46';
            const textMain = computedStyle.getPropertyValue('--text-main').trim() || '#f4f4f5';
            const textMuted = computedStyle.getPropertyValue('--text-muted').trim() || '#a1a1aa';
            const accentColor = computedStyle.getPropertyValue('--accent-color').trim() || '#6366f1';

            // Insert solid background rect
            const rect = document.createElementNS(SVGChartRenderer.ns, "rect");
            rect.setAttribute("width", "100%");
            rect.setAttribute("height", "100%");
            rect.setAttribute("fill", panelBg);
            clone.insertBefore(rect, clone.firstChild);

            // Embed an explicit style block into the exported SVG to preserve text alignment and classes
            const styleEl = document.createElementNS(SVGChartRenderer.ns, "style");
            styleEl.textContent = `
                .node-rect { fill: ${cardBg}; stroke: ${borderColor}; stroke-width: 1.5px; rx: 6px; }
                .node-group.marked .node-rect { stroke: #392727; stroke-width: 2.5px; fill: #1d1814ad; }
                .gen-tag { font-family: sans-serif; font-size: 11px; fill: ${textMuted}; font-weight: bold; letter-spacing: 0.5px; text-anchor: end; }
                .name-text { font-size: 22px; font-weight: bold; fill: ${textMain}; }
                .date-text { font-family: sans-serif; font-size: 11px; fill: ${textMuted}; text-anchor: end; }
                .connector-branch { fill: none; stroke: ${borderColor}; stroke-width: 2px; }
            `;
            clone.insertBefore(styleEl, clone.firstChild.nextSibling);

            const serializer = new XMLSerializer();
            return serializer.serializeToString(clone);
        }

        document.getElementById("export-png").addEventListener("click", () => triggerRasterExport("image/png"));
        document.getElementById("export-jpg").addEventListener("click", () => triggerRasterExport("image/jpeg"));

        function triggerRasterExport(mimeType) {
            const svgStr = getReadySVGString();
            if (!svgStr) return;

            const svgElement = document.querySelector("#chart-container svg");
            const width = svgElement.clientWidth || 1200;
            const height = svgElement.clientHeight || 800;

            const blob = new Blob([svgStr], { type: "image/svg+xml;charset=utf-8" });
            const blobURL = URL.createObjectURL(blob);

            const image = new Image();
            image.onload = () => {
                const canvas = document.createElement("canvas");
                canvas.width = width * 2;
                canvas.height = height * 2;
                const context = canvas.getContext("2d");

                context.scale(2, 2);
                if (mimeType === "image/jpeg") {
                    context.fillStyle = "#18181b";
                    context.fillRect(0, 0, width, height);
                }

                context.drawImage(image, 0, 0, width, height);

                canvas.toBlob(canvasBlob => {
                    const ext = mimeType === "image/png" ? "png" : "jpg";
                    downloadFile(canvasBlob, `genealogy-chart.${ext}`);
                }, mimeType, 0.95);
            };
            image.src = blobURL;
        }

        // Initialize App: Fetch JSON data then render
        window.onload = async () => {
            await GenealogyStore.init();
            refreshApp();
        };
    </script>
</body>
</html>
